[project]
name = "quoted-printable-decoder"
version = "0.1.0"
description = "Converts text to and from the MIME quoted-printable format defined by RFC 2045."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
